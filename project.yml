name: Climbing

options:
  bundleIdPrefix: com.cooperperry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Climbing:
    type: application
    platform: iOS
    sources:
      - path: Climbing
    dependencies:
      - sdk: HealthKit.framework
      - target: ClimbingWatch
        embed: true
    entitlements:
      path: Climbing/Climbing.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cooperperry.climbing
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SummitPulse
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "SummitPulse reads heart rate, HRV, and energy from Apple Health to measure climbing strain and calories."
        INFOPLIST_KEY_NSMotionUsageDescription: "SummitPulse uses the barometer and wrist motion to measure vertical gain and climbing vs rest."

  ClimbingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - ClimbingWatch
      - Climbing/Domain
    entitlements:
      path: ClimbingWatch/ClimbingWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cooperperry.climbing.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: SummitPulse
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.cooperperry.climbing
        INFOPLIST_KEY_NSHealthShareUsageDescription: "SummitPulse reads heart rate, HRV, and energy during a climb."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "SummitPulse starts a Watch workout to record elevation, heart rate, and calories."
        INFOPLIST_KEY_NSMotionUsageDescription: "SummitPulse uses the barometer and wrist motion to measure vertical gain."

  ClimbingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClimbingTests
    dependencies:
      - target: Climbing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cooperperry.climbingTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Climbing:
    build:
      targets:
        Climbing: all
        ClimbingWatch: all
        ClimbingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClimbingTests
